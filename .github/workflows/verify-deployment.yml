name: Kontroller publisert plattform
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.production_environment == true || github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Finn verifisert produksjonsadresse
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/resolve-vercel-production.mjs
      - name: Kontroller API, nettside og kodeversjon
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.production_url }}
          EXPECTED_COMMIT: ${{ github.event.deployment.sha || github.sha }}
        run: node scripts/verify-deployment.mjs
